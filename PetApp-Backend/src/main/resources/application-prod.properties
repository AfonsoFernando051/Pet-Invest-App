# ===============================
# PRODUCTION PROFILE
# ===============================
# Activate with `SPRING_PROFILES_ACTIVE=prod` (or -Dspring.profiles.active=prod).
# Only overrides what differs from application.properties (the dev/default
# profile) — everything not repeated here (JWT/API secrets via DotenvLoader or
# real env vars, security filter chain, etc.) stays the same.

# ===============================
# DATABASE (PostgreSQL — see docs/ARCHITECTURE.md)
# ===============================
# Supplied by the deployment environment; never hardcode real credentials here.
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ===============================
# FLYWAY
# ===============================
# Schema only — deliberately excludes db/migration-dev (the dev/test seed
# data, including the admin/admin test account). A predictable default admin
# account must never exist in a real database; this is the enforcement point.
spring.flyway.locations=classpath:db/migration

# ===============================
# JPA / HIBERNATE
# ===============================
# `validate`, not `create-drop`/`update`: production schema changes go through
# Flyway (see db/migration), never silent auto-DDL that could alter or drop
# real user data. Hibernate only checks the entity mappings match what Flyway
# already applied, and fails loudly (rather than silently) if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===============================
# H2 CONSOLE — must never be reachable in production
# ===============================
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# ===============================
# CORS
# ===============================
# Must be set to the real mobile/web app origin(s) via environment variable —
# intentionally left without a wildcard fallback so a misconfigured deploy
# fails closed instead of silently allowing any origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
