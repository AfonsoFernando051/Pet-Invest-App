# Default/development profile — active whenever no explicit Spring profile is
# set. Production overrides live in application-prod.properties (activated
# via SPRING_PROFILES_ACTIVE=prod); this file's defaults are intentionally
# permissive (H2 console open, CORS wildcard) for local development only.
spring.application.name=PetApp
server.port=8081

# ===============================
# H2 DATABASE
# ===============================
spring.datasource.url=jdbc:h2:mem:petapp-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# FLYWAY
# ===============================
# db/migration (schema) applies in every environment; db/migration-dev (seed
# data, including the admin/admin test account) is additive here only —
# application-prod.properties overrides this to db/migration alone, so
# production never sees the dev seed data.
spring.flyway.locations=classpath:db/migration,classpath:db/migration-dev

# ===============================
# JPA / HIBERNATE
# ===============================
# Flyway owns the schema now — Hibernate only validates the entity mappings
# match it, never creates/alters tables itself. The dev H2 database is
# in-memory, so Flyway still re-runs the full migration set (schema + seed
# data) on every app restart, same practical effect `create-drop` used to have.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# H2 CONSOLE
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.h2.console.settings.web-allow-others=true

spring.devtools.restart.enabled=false

# ===============================
# CORS
# ===============================
# Wildcard is fine for local development only. application-prod.properties
# overrides this to the app's real domain(s) — see SecurityConfig.
app.cors.allowed-origins=*

# ===============================
# SECRETS
# ===============================
# jwt.secret, api.brapi.token, api.libretranslate.key and api.gemini.key are
# intentionally left blank here — they're supplied via a local, git-ignored
# `.env` file (see .env.example) or real environment variables in
# production, never committed to source control. See DotenvLoader.
jwt.secret=
jwt.expiration=3600000

# ===============================
# EXTERNAL APIS
# ===============================
api.brapi.token=

# LibreTranslate: translates onboarding content into the languages exposed by
# the app's Settings screen (pt is canonical, en/es are translated on demand).
# Public instance has rate limits; point to a self-hosted instance in production.
api.libretranslate.url=https://libretranslate.com
api.libretranslate.key=

# Gemini: powers the AI Investment Mentor chat (see docs/AI_MENTOR.md). The
# key is server-side only and never sent to the mobile client.
api.gemini.key=
api.gemini.model=gemini-2.0-flash
api.gemini.baseUrl=https://generativelanguage.googleapis.com/v1beta