# ─────────────────────────────────────────────────────────────────────
# Pet-Invest-App  —  Continuous Integration
# Runs backend (Spring Boot / Java 21) and mobile (Flutter) tests
# on every push and pull-request to main.
# ─────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────
  backend:
    name: Backend Tests (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PetApp-Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: PetApp-Backend/pom.xml

      - name: Run tests
        run: ./mvnw verify -B -q

  # ── Mobile ───────────────────────────────────────────────────────
  mobile:
    name: Flutter Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petapp_mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
